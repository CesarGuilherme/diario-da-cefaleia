<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diário da Cefaléia</title>
  <meta name="description" content="Diário de crises de cefaleia: registre, acompanhe e descubra o gatilho.">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cefaléia">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a13; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: #fff; -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }
    #root { height: 100%; }
    input::placeholder { color: rgba(235,235,245,.38); }
    button { -webkit-tap-highlight-color: transparent; }
    button:active { transform: scale(.98); }
    @keyframes pulsar { 0%, 100% { opacity: 1 } 50% { opacity: .4 } }

    /* Espera: um pulso que respira dentro de um disco de vidro, na mesma cadência (2.4s)
       do aviso de crise aberta. Mora aqui porque a casca pré-React usa a mesma marcação
       que o componente <Carregando/> — quando o React monta, nada pisca nem salta. */
    .carregando {
      min-height: 100%; box-sizing: border-box; padding: 32px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    }
    .carregando.em-linha { min-height: 0; padding: 40px 16px }
    .carregando p { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; color: rgba(235,235,245,.5) }
    .pulso {
      position: relative; width: 84px; height: 84px; display: grid; place-items: center;
      border-radius: 999px; background: rgba(255,255,255,.07);
      border: .5px solid rgba(255,255,255,.14);
      box-shadow: inset 1px 1px 1px rgba(255,255,255,.10), 0 10px 28px rgba(0,0,0,.28);
      -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
    }
    .pulso b {
      width: 13px; height: 13px; border-radius: 999px;
      background: linear-gradient(180deg, #a99cff, #7c6cf6);
      box-shadow: 0 0 20px rgba(124,108,246,.75), inset 1px 1px 1px rgba(255,255,255,.5);
      animation: respirar 2.4s ease-in-out infinite;
    }
    .pulso i {
      position: absolute; inset: -1px; border-radius: 999px;
      border: 1px solid rgba(124,108,246,.45); opacity: 0;
      animation: onda 2.4s cubic-bezier(.22,.61,.36,1) infinite;
    }
    .pulso i:nth-of-type(2) { animation-delay: 1.2s }
    @keyframes respirar { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.6) } }
    @keyframes onda { 0% { transform: scale(.55); opacity: 0 } 25% { opacity: .7 } 100% { transform: scale(1.55); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important }
      button:active { transform: none }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="carregando" role="status" aria-live="polite">
      <div class="pulso"><i></i><i></i><b></b></div>
      <p>Carregando…</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
